  var stage = document.getElementById('stage');
  var W = stage.clientWidth || window.innerWidth, H = stage.clientHeight || window.innerHeight;

  var renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
  renderer.setSize(W, H);
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1030);
  scene.fog = new THREE.Fog(0x0b1030, 14, 28);

  var camera = new THREE.PerspectiveCamera(72, W/H, 0.1, 100);
  camera.position.set(0, 1.7, 5.2);

  var RW = 12, RH = 5, RD = 12; // room width, height, depth
  var loader = new THREE.TextureLoader();
  var pending = 0, started = false;
  function tex(uri){
    pending++;
    var t = loader.load(uri, done, undefined, done);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }
  function done(){ pending--; if(pending<=0 && !started){ started=true; var l=document.getElementById('loading'); if(l) l.remove(); } }

  function wall(texUri, w, h, pos, rotY){
    var geo = new THREE.PlaneGeometry(w, h);
    var mat = new THREE.MeshBasicMaterial({ map: tex(texUri) });
    var m = new THREE.Mesh(geo, mat);
    m.position.set(pos.x, pos.y, pos.z);
    if(rotY) m.rotation.y = rotY;
    scene.add(m);
    return m;
  }
  function solid(color, w, h, pos, rotX){
    var geo = new THREE.PlaneGeometry(w, h);
    var mat = new THREE.MeshBasicMaterial({ color: color });
    var m = new THREE.Mesh(geo, mat);
    m.position.set(pos.x, pos.y, pos.z);
    if(rotX) m.rotation.x = rotX;
    scene.add(m);
  }

  // Walls (photos face inward)
  wall(TEX.class, RW, RH, {x:0, y:RH/2, z:-RD/2}, 0);                 // far wall: classroom
  wall(TEX.wait,  RW, RH, {x:0, y:RH/2, z:RD/2},  Math.PI);           // behind: waiting area
  wall(TEX.hall,  RD, RH, {x:-RW/2, y:RH/2, z:0}, Math.PI/2);         // left: hall
  wall(TEX.elev,  RD, RH, {x:RW/2,  y:RH/2, z:0}, -Math.PI/2);        // right: elevator
  solid(0x12152a, RW, RD, {x:0, y:0,  z:0}, -Math.PI/2);              // floor
  solid(0x0d1130, RW, RD, {x:0, y:RH, z:0},  Math.PI/2);             // ceiling

  // Look controls (drag)
  var yaw = Math.PI, pitch = 0, dragging=false, lx=0, ly=0;
  function down(e){ dragging=true; var p=pt(e); lx=p.x; ly=p.y; }
  function move(e){ if(!dragging) return; var p=pt(e); yaw -= (p.x-lx)*0.005; pitch -= (p.y-ly)*0.005; pitch=Math.max(-1.2,Math.min(1.2,pitch)); lx=p.x; ly=p.y; }
  function up(){ dragging=false; }
  function pt(e){ return e.touches? {x:e.touches[0].clientX,y:e.touches[0].clientY} : {x:e.clientX,y:e.clientY}; }
  var el = renderer.domElement;
  el.addEventListener('pointerdown', down); window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);

  // Move controls
  var keys={};
  window.addEventListener('keydown', function(e){ keys[e.key.toLowerCase()]=true; if(['arrowup','arrowdown','arrowleft','arrowright'].indexOf(e.key.toLowerCase())>=0) e.preventDefault(); });
  window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()]=false; });

  var clock = new THREE.Clock();
  function loop(){
    requestAnimationFrame(loop);
    var dt = Math.min(0.05, clock.getDelta());
    // orientation
    var dir = new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(yaw)*Math.cos(pitch));
    camera.lookAt(camera.position.clone().add(dir));
    // movement on xz plane
    var fwd = new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)).normalize();
    var right = new THREE.Vector3(fwd.z,0,-fwd.x);
    var sp = 3.2*dt, mv = new THREE.Vector3();
    if(keys['w']||keys['arrowup']) mv.add(fwd);
    if(keys['s']||keys['arrowdown']) mv.sub(fwd);
    if(keys['a']||keys['arrowleft']) mv.add(right);
    if(keys['d']||keys['arrowright']) mv.sub(right);
    if(mv.lengthSq()>0){ mv.normalize().multiplyScalar(sp); camera.position.add(mv); }
    // clamp inside room
    var lim = RW/2 - 0.8;
    camera.position.x = Math.max(-lim, Math.min(lim, camera.position.x));
    camera.position.z = Math.max(-(RD/2-0.8), Math.min(RD/2-0.8, camera.position.z));
    camera.position.y = 1.7;
    renderer.render(scene, camera);
  }
  loop();

  window.addEventListener('resize', function(){
    var w=stage.clientWidth||window.innerWidth, h=stage.clientHeight||window.innerHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h);
  });
  // safety: clear loader after 4s regardless
  setTimeout(function(){ var l=document.getElementById('loading'); if(l) l.remove(); }, 4000);
})();
</script>
