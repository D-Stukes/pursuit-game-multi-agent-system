  }

  // Classroom from four angles:
  wall(TEX.c1, RW, RH, {x:0, y:RH/2, z:-RD/2}, 0);          // front: projector view
  wall(TEX.c3, RW, RH, {x:0, y:RH/2, z:RD/2},  Math.PI);    // back
  wall(TEX.c2, RD, RH, {x:-RW/2, y:RH/2, z:0}, Math.PI/2);  // left
  wall(TEX.c4, RD, RH, {x:RW/2,  y:RH/2, z:0}, -Math.PI/2); // right
  solid(null, 0x2b2b31, RW, RD, {x:0, y:0,  z:0}, -Math.PI/2);  // floor (grey carpet)
  solid(TEX.cc, 0, RW, RD, {x:0, y:RH, z:0},  Math.PI/2);       // ceiling (real ceiling photo)

  var yaw = Math.PI, pitch = 0, dragging=false, lx=0, ly=0;
  function down(e){ dragging=true; var p=pt(e); lx=p.x; ly=p.y; }
  function move(e){ if(!dragging) return; var p=pt(e); yaw -= (p.x-lx)*0.005; pitch -= (p.y-ly)*0.005; pitch=Math.max(-1.1,Math.min(1.1,pitch)); lx=p.x; ly=p.y; }
  function up(){ dragging=false; }
  function pt(e){ return e.touches? {x:e.touches[0].clientX,y:e.touches[0].clientY} : {x:e.clientX,y:e.clientY}; }
  renderer.domElement.addEventListener('pointerdown', down); window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);

  var keys={};
  window.addEventListener('keydown', function(e){ keys[e.key.toLowerCase()]=true; if(['arrowup','arrowdown','arrowleft','arrowright'].indexOf(e.key.toLowerCase())>=0) e.preventDefault(); });
  window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()]=false; });

  var clock = new THREE.Clock();
  function loop(){
    requestAnimationFrame(loop);
    var dt = Math.min(0.05, clock.getDelta());
    var dir = new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(yaw)*Math.cos(pitch));
    camera.lookAt(camera.position.clone().add(dir));
    var fwd = new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)).normalize();
    var right = new THREE.Vector3(fwd.z,0,-fwd.x);
    var sp = 3.0*dt, mv = new THREE.Vector3();
    if(keys['w']||keys['arrowup']) mv.add(fwd);
    if(keys['s']||keys['arrowdown']) mv.sub(fwd);
    if(keys['a']||keys['arrowleft']) mv.add(right);
    if(keys['d']||keys['arrowright']) mv.sub(right);
    if(mv.lengthSq()>0){ mv.normalize().multiplyScalar(sp); camera.position.add(mv); }
    var lim = RW/2 - 0.8;
    camera.position.x = Math.max(-lim, Math.min(lim, camera.position.x));
    camera.position.z = Math.max(-(RD/2-0.8), Math.min(RD/2-0.8, camera.position.z));
    camera.position.y = 1.7;
    renderer.render(scene, camera);
  }
  loop();

  window.addEventListener('resize', function(){
    var w=stage.clientWidth||window.innerWidth, h=stage.clientHeight||window.innerHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h);
  });
  setTimeout(function(){ var l=document.getElementById('loading'); if(l) l.remove(); }, 4500);
})();
</script>
